name = "squares-app"
main = "index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
routes = [{ pattern = "squares.amqm.dev/api/*", zone_name = "amqm.dev" }]

[[d1_databases]]
binding = "DB"
database_name = "squares-db"
database_id = "172f4b56-c4d1-416b-966a-ced0bb24b04a"
migrations_dir = "drizzle/migrations"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

# R2 Storage binding (optional)
# Uncomment and configure after running: wrangler r2 bucket create <bucket-name>
# [[r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "your-bucket-name"

# Hyperdrive binding for PlanetScale (alternative to D1)
# Uncomment and configure after running: wrangler hyperdrive create <hyperdrive-name> --connection-string="mysql://..."
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "your-hyperdrive-id"

[vars]
# Non-secret environment variables can go here
# ENVIRONMENT = "development"

# For local development, create a .dev.vars file with your secrets
# For production, use: wrangler secret put <SECRET_NAME>
